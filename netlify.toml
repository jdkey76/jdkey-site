[build]
  command = "python3 build.py"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cache long pour les fichiers statiques (versionnés par ?v=)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin-planning/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "https://www.jdkey-auto-rouen.fr/*"
  to = "https://jdkey-auto-rouen.fr/:splat"
  status = 301
  force = true
